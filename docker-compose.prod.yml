# Шина и агент — постоянная часть поставки, не надстройка (Р-44): каждая установка,
# коробка и облако одинаково, всегда поднимает RabbitMQ и агента данных. `BUS_USER`
# и `BUS_PASSWORD` — в `.env.prod` на сервере, не в репозитории (Р-13/Р-40, раздел 8).
name: revolit

services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    # Наружу не пробрасывается — снаружи доступ только через https-прокси
    # перед приложением (терминирует TLS). Внутри сети revolit_net
    # прокси обращается к контейнеру по имени, порт наружу не нужен.
    environment:
      DATABASE_URL: postgresql://revolit:${DB_PASSWORD}@db:5432/revolit
      NODE_ENV: production
      STORAGE_DIR: /app/storage
      BUS_URL: amqp://${BUS_USER}:${BUS_PASSWORD}@rabbitmq:5672
    depends_on:
      - db
      - agent
    # Вложения (Р-38) хранятся на диске сервера через StoragePort — без тома
    # каждый пересоздание контейнера при обновлении стирало бы все файлы
    volumes:
      - revolit_storage:/app/storage
    networks:
      - revolit_net

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: revolit
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: revolit
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - revolit_pgdata:/var/lib/postgresql/data
    networks:
      - revolit_net

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${BUS_USER}
      RABBITMQ_DEFAULT_PASS: ${BUS_PASSWORD}
      # Сервер небольшой — не даём брокеру занимать больше положенного
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.3"
    volumes:
      - revolit_bus:/var/lib/rabbitmq
    # Публичный адрес шины: обычная часть архитектуры (docs/11b, раздел 2.1), а не
    # отверстие «для второго агента» специально — ограничивать источник подключения
    # нужно на уровне файрвола перед сервером, не в этом файле (docs/11b, раздел 5, п.3)
    ports:
      - "5672:5672"
    networks:
      - revolit_net

  agent:
    image: revolit-app:latest
    restart: unless-stopped
    command: ["./apps/agent/entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql://revolit:${DB_PASSWORD}@db:5432/revolit
      BUS_URL: amqp://${BUS_USER}:${BUS_PASSWORD}@rabbitmq:5672
      AGENT_NAME: agent-1
      AGENT_PRIORITY: "0"
      # Планировщик — только на этом агенте: ScheduledJob лежит в БД №1 (ТЗ 7)
      SCHEDULER_ENABLED: "1"
      SCHEDULER_UTC_OFFSET_MINUTES: "${SCHEDULER_UTC_OFFSET_MINUTES:-0}"
      NODE_ENV: production
    depends_on:
      - db
      - rabbitmq
    networks:
      - revolit_net

volumes:
  revolit_pgdata:
  revolit_storage:
  revolit_bus:

networks:
  revolit_net:
    name: revolit_net
