# Сервер №2 (docs/11b, раздел 2.2). НЕ имеет отношения к деплою сервера №1 — отдельный
# файл, отдельный образ (Dockerfile.agent2), запускается на другой машине:
#   docker build -f Dockerfile.agent2 -t revolit-agent2:latest .
#   docker compose -f docker-compose.agent2.yml --env-file .env.agent2 up -d
# .env.agent2 (на сервере №2, не в репозитории): DB_PASSWORD, BUS_URL (публичный адрес
# шины сервера №1), DATABASE_URL_PRIMARY (прямое подключение к БД №1 в обход шины —
# решение владельца, docs/08-decisions.md Р-41).
name: revolit-server2

services:
  db2:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: revolit
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: revolit
    volumes:
      - revolit_db2:/var/lib/postgresql/data
    networks:
      - agent2_net

  agent2:
    build:
      context: .
      dockerfile: Dockerfile.agent2
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://revolit:${DB_PASSWORD}@db2:5432/revolit
      DATABASE_URL_PRIMARY: ${DATABASE_URL_PRIMARY}
      BUS_URL: ${BUS_URL}
      AGENT_NAME: agent-2
      AGENT_PRIORITY: "10"
      NODE_ENV: production
    depends_on:
      - db2
    networks:
      - agent2_net

volumes:
  revolit_db2:

networks:
  agent2_net:
    name: revolit_server2_net
