name: revolit

services:
  app:
    build:
      context: .
      target: builder
    command: npm run dev
    ports:
      - "3210:3000"
    volumes:
      - .:/app
      - revolit_node_modules:/app/node_modules
      # Отдельный том поверх подпапки, чтобы загруженные вложения (Р-38)
      # не утекали в папку проекта, синхронизируемую в Яндекс.Диск
      - revolit_storage:/app/storage
    environment:
      DATABASE_URL: postgresql://revolit:revolit@db:5432/revolit
      NODE_ENV: development
      APP_URL: http://localhost:3210
      MAIL_HOST: mail
      MAIL_PORT: "1025"
      MAIL_FROM: Revolit <no-reply@revolit.local>
      # Явно, а не по process.cwd(): у `next dev` (npm workspaces) он —
      # /app/apps/crm, а у собранного сервера в проде — /app (Р-38)
      STORAGE_DIR: /app/storage
      # Шина — постоянная часть поставки, не переключатель (Р-44)
      BUS_URL: amqp://revolit:revolit@rabbitmq:5672
    depends_on:
      - db
      - mail
      - agent
    networks:
      - revolit_net

  # Перехватчик почты для разработки: письма никуда не уходят,
  # их видно в веб-интерфейсе на http://localhost:8026
  mail:
    image: mailhog/mailhog:latest
    ports:
      - "8026:8025"
    networks:
      - revolit_net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: revolit
      POSTGRES_PASSWORD: revolit
      POSTGRES_DB: revolit
    ports:
      - "15432:5432"
    volumes:
      - revolit_pgdata:/var/lib/postgresql/data
    networks:
      - revolit_net

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: revolit
      RABBITMQ_DEFAULT_PASS: revolit
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.3"
    ports:
      - "5672:5672"
    volumes:
      - revolit_bus:/var/lib/rabbitmq
    networks:
      - revolit_net

  agent:
    build:
      context: .
      target: builder
    command: sh -c "npm run schema && npx tsx apps/agent/src/index.ts"
    environment:
      DATABASE_URL: postgresql://revolit:revolit@db:5432/revolit
      BUS_URL: amqp://revolit:revolit@rabbitmq:5672
      AGENT_NAME: agent-1
      AGENT_PRIORITY: "0"
      SCHEDULER_ENABLED: "1"
      NODE_ENV: development
    volumes:
      - .:/app
      - revolit_node_modules:/app/node_modules
    depends_on:
      - db
      - rabbitmq
    networks:
      - revolit_net

volumes:
  revolit_pgdata:
  revolit_node_modules:
  revolit_storage:
  revolit_bus:

networks:
  revolit_net:
    name: revolit_net
