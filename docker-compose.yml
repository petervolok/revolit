name: revolit

services:
  app:
    build:
      context: .
      target: builder
    command: npm run dev
    ports:
      - "3210:3000"
    volumes:
      - .:/app
      - revolit_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://revolit:revolit@db:5432/revolit
      NODE_ENV: development
      APP_URL: http://localhost:3210
      MAIL_HOST: mail
      MAIL_PORT: "1025"
      MAIL_FROM: Revolit <no-reply@revolit.local>
    depends_on:
      - db
      - mail
    networks:
      - revolit_net

  # Перехватчик почты для разработки: письма никуда не уходят,
  # их видно в веб-интерфейсе на http://localhost:8026
  mail:
    image: mailhog/mailhog:latest
    ports:
      - "8026:8025"
    networks:
      - revolit_net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: revolit
      POSTGRES_PASSWORD: revolit
      POSTGRES_DB: revolit
    ports:
      - "15432:5432"
    volumes:
      - revolit_pgdata:/var/lib/postgresql/data
    networks:
      - revolit_net

volumes:
  revolit_pgdata:
  revolit_node_modules:

networks:
  revolit_net:
    name: revolit_net
