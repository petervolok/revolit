# Прокси перед приложением: терминирует https (сертификат временный, самоподписанный —
# см. docs/05-deployment.md) и показывает окно обслуживания, пока новая версия
# поднимается при обновлении (Р-31). Не собирается в образ — конфигурация сервера,
# живёт вне приложения.
server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    root /usr/share/nginx/maintenance;

    location / {
        proxy_pass http://revolit-app-1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        error_page 502 503 504 = @maintenance;
    }

    location @maintenance {
        try_files /maintenance.html =502;
    }
}
