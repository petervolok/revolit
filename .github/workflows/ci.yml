name: CI

# Пока автотестов нет (см. docs/09-conventions.md) — проверяем типы и сборку.
# Слои unit/integration/e2e добавляются в этот же файл по мере появления
# (шаги закомментированы ниже — раскомментировать, когда появятся npm-скрипты).
on:
  push:
    branches: [main, master, experiment]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revolit
          POSTGRES_PASSWORD: revolit
          POSTGRES_DB: revolit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: revolit
          RABBITMQ_DEFAULT_PASS: revolit
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # По lock-файлу — так же, как в Dockerfile
      - name: Установка зависимостей
        run: npm ci

      - name: Схема Prisma
        run: npm run schema

      - name: Применение миграций к тестовой базе
        run: npx prisma migrate deploy --schema apps/crm/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://revolit:revolit@localhost:5432/revolit

      # Схема и миграции не должны расходиться: иначе следующая `migrate dev`
      # молча породит «исправляющую» миграцию. Проверка ловит ошибку в миграции,
      # написанной вручную (например, с переносом данных).
      - name: Схема и миграции согласованы
        run: |
          PGPASSWORD=revolit psql -h localhost -U revolit -d revolit -c 'CREATE DATABASE shadow'
          npx prisma migrate diff \
            --from-migrations apps/crm/prisma/migrations \
            --to-schema-datamodel apps/crm/prisma/schema.prisma \
            --shadow-database-url postgresql://revolit:revolit@localhost:5432/shadow \
            --exit-code

      # Без сгенерированного клиента в типах Prisma нет моделей — typecheck падает
      - name: Клиент Prisma
        run: npx prisma generate --schema apps/crm/prisma/schema.prisma

      - name: Проверка типов
        run: npm run typecheck

      - name: Проверка типов агента
        run: npx tsc -p apps/agent

      - name: Сборка агента (бандл)
        run: npx esbuild apps/agent/src/index.ts --bundle --platform=node --target=node20 --external:@prisma/client --outfile=apps/agent/dist/agent.js

      # Настоящие Postgres и RabbitMQ: обмен, идемпотентность, события, приоритет, kill -9, штатная остановка
      - name: Проверка шины и агентов
        run: npx tsx tools/bus-smoke.ts
        env:
          DATA_MODE: bus
          BUS_URL: amqp://revolit:revolit@localhost:5672
          DATABASE_URL: postgresql://revolit:revolit@localhost:5432/revolit

      # - name: Модульные и интеграционные тесты
      #   run: npm test
      #   env:
      #     DATABASE_URL: postgresql://revolit:revolit@localhost:5432/revolit

      - name: Сборка
        run: npm run build

      # - name: E2E
      #   run: npm run test:e2e

      - name: Уведомление в Telegram при сбое
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>Revolit CI упал</b>%0Aветка: ${{ github.ref_name }}%0Aкоммит: ${{ github.sha }}%0Aавтор: ${{ github.actor }}%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
